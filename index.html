<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<style>
  :root{
    --bg: #0a0a10;
    --bg-glow: #1b1533;
    --card: #15141d;
    --card-2: #0e0d13;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #eeeef4;
    --text-secondary: #a3a1b3;
    --text-muted: #6e6c7e;
    --accent: #8b7cf6;
    --accent-strong: #a996ff;
    --accent-dim: rgba(139,124,246,0.12);
    --radius: 16px;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      radial-gradient(600px 400px at 50% -100px, var(--bg-glow), transparent 70%),
      var(--bg);
    color:var(--text-primary);
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .header{text-align:center;margin-bottom:48px;}
  .header .icon{
    width:52px;height:52px;border-radius:12px;
    background:var(--accent-dim);
    border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
    color:var(--accent-strong);
  }
  .header h1{font-size:26px;font-weight:600;margin:0 0 10px;letter-spacing:-0.01em;}
  .header p{font-size:15px;color:var(--text-secondary);margin:0;line-height:1.5;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    margin-bottom:20px;
  }
  .card .tag{
    display:inline-block;
    font-size:12px;
    font-family:var(--mono);
    color:var(--accent-strong);
    background:var(--accent-dim);
    border:1px solid rgba(139,124,246,0.25);
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:16px;
  }
  .card h2{font-size:19px;font-weight:600;margin:0 0 16px;}

  .terminal{
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .terminal .bar{
    display:flex;align-items:center;gap:7px;
    padding:11px 14px;
    border-bottom:1px solid var(--border);
  }
  .terminal .dot{width:10px;height:10px;border-radius:50%;}
  .terminal .dot.r{background:#ff5f57;}
  .terminal .dot.y{background:#febc2e;}
  .terminal .dot.g{background:#28c840;}
  .terminal .bar .label{
    margin-left:8px;font-size:12px;color:var(--text-muted);font-family:var(--mono);
  }
  .terminal .body{
    padding:18px 16px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    color:#c9c7db;
    white-space:pre-wrap;
    word-break:break-all;
  }

  .copy-btn{
    width:100%;
    margin-top:16px;
    padding:13px;
    border-radius:10px;
    border:none;
    background:var(--text-primary);
    color:#0a0a10;
    font-size:15px;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    transition:opacity 0.15s ease, transform 0.1s ease;
  }
  .copy-btn:hover{opacity:0.9;}
  .copy-btn:active{transform:scale(0.98);}
  .copy-btn.copied{background:#28c840;color:#04340f;}

  .footer{
    text-align:center;
    margin-top:36px;
    font-size:13px;
    color:var(--text-muted);
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
    </div>
    <h1>Shared items</h1>
    <p>Everything below is kept current. Tap copy to grab what you need.</p>
  </div>

  <div id="cards"></div>

  <div class="footer">Works on every device · Copy &amp; paste</div>
</div>

<script>
  // Edit this array to change what's shown. Each item becomes one card.
  const items = [
    {
      tag: "Item 01",
      title: "Example note",
      windowLabel: "clipboard.txt",
      content: "Replace this with your first real note, quote, link, or snippet."
    },
    {
      tag: "Item 02",
      title: "Second example",
      windowLabel: "clipboard.txt",
      content: "Add as many cards as you like by adding more entries to the items array above."
    }
  ];

  const container = document.getElementById('cards');

  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="tag">${item.tag}</span>
      <h2>${item.title}</h2>
      <div class="terminal">
        <div class="bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="label">${item.windowLabel}</span>
        </div>
        <div class="body">${item.content}</div>
      </div>
      <button class="copy-btn" data-index="${i}">Copy</button>
    `;
    container.appendChild(card);
  });

  container.addEventListener('click', (e) => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const idx = Number(btn.dataset.index);
    navigator.clipboard.writeText(items[idx].content).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  });
</script>

</body>
</html>
