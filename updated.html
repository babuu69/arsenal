<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updated</title>
<style>
  :root{
    --bg: #0a0a10;
    --bg-glow: #1b1533;
    --card: #15141d;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #eeeef4;
    --text-secondary: #a3a1b3;
    --text-muted: #6e6c7e;
    --accent: #8b7cf6;
    --accent-strong: #a996ff;
    --accent-dim: rgba(139,124,246,0.12);
    --radius: 20px;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:
      radial-gradient(600px 500px at 50% 30%, var(--bg-glow), transparent 70%),
      var(--bg);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:440px;
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:40px 32px;
    text-align:center;
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;
    color:var(--accent-strong);
    background:var(--accent-dim);
    border:1px solid rgba(139,124,246,0.25);
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:24px;
  }
  .badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-strong);}
  h1{font-size:28px;font-weight:600;margin:0 0 16px;letter-spacing:-0.01em;}
  p{font-size:15px;color:var(--text-secondary);line-height:1.6;margin:0 0 28px;}
  a.btn{
    display:block;
    padding:14px;
    border-radius:12px;
    background:var(--text-primary);
    color:#0a0a10;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    margin-bottom:16px;
  }
  a.btn:hover{opacity:0.9;}
  .hint{font-size:13px;color:var(--text-muted);margin:0;}
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><span class="pulse"></span>Update available</span>
    <h1 id="title">This moved</h1>
    <p id="desc">The link you followed is out of date. Use the current one below.</p>
    <a class="btn" id="go-btn" href="#">Open new link</a>
    <p class="hint">This redirect is specific to the link you just clicked.</p>
  </div>

<script>
  // This page takes its destination from the link itself — nothing is
  // hardcoded here, and nothing is shared between different items.
  //
  // A link pointing here looks like:
  //   updated.html?to=https://real-destination.com&name=My%20resource
  //
  // "to"   = where the Open new link button should actually go
  // "name" = (optional) a label shown in the heading

  const params = new URLSearchParams(window.location.search);
  const destination = params.get("to");
  const name = params.get("name");

  const btn = document.getElementById("go-btn");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");

  if (destination) {
    btn.href = destination;
    if (name) {
      title.textContent = name + " moved";
    }
  } else {
    title.textContent = "Nothing to redirect to";
    desc.textContent = "This page needs a destination link to work. Add ?to=... to the URL.";
    btn.style.display = "none";
  }
</script>

</body>
</html>
