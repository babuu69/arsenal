<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Vault</title>
</head>
<body>

  <h1>My shared items</h1>
  <p>Tap copy to grab what you need.</p>

  <div id="cards">

    <div class="card">
      <h2>Example note</h2>
      <p id="text-1">Replace this with your first real note, quote, link, or snippet.</p>
      <button onclick="copyText('text-1')">Copy</button>
    </div>

  </div>

  <script>
    function copyText(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text);
      alert("Copied!");
    }
  </script>

</body>
</html>
